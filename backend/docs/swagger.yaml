basePath: /
definitions:
  internal_handler.LoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  internal_handler.UpdateUserStatusRequest:
    properties:
      status:
        example: active
        type: string
    required:
    - status
    type: object
  internal_handler.chatRequest:
    properties:
      messages:
        items:
          $ref: '#/definitions/medicalagent_internal_service.LLMChatMessage'
        type: array
      system_prompt:
        example: 你是一个中医专家
        type: string
      tool_choice:
        type: string
      tools:
        items:
          items:
            type: integer
          type: array
        type: array
      user_prompt:
        example: 请解释什么是辨证论治
        type: string
    type: object
  internal_handler.createAgentRunRequest:
    properties:
      herbs:
        example:
        - 麻黄
        - 桂枝
        items:
          type: string
        type: array
      research_goal:
        example: 分析麻黄桂枝汤的现代药理作用机制
        type: string
    type: object
  internal_handler.createAgentSessionRequest:
    properties:
      title:
        example: 关于麻黄的药理咨询
        type: string
    type: object
  internal_handler.knowledgeSearchRequest:
    properties:
      limit:
        example: 5
        type: integer
      query:
        example: 麻黄的功效
        type: string
      types:
        example:
        - herb
        - decoction
        items:
          type: string
        type: array
    type: object
  internal_handler.sendAgentMessageRequest:
    properties:
      content:
        example: 请分析麻黄在宣肺平喘方面的科学原理
        type: string
    type: object
  internal_handler.updateLLMConfigRequest:
    properties:
      api_key:
        example: sk-...
        type: string
      base_url:
        example: https://api.openai.com/v1
        type: string
      enabled:
        example: true
        type: boolean
      model_name:
        example: gpt-4
        type: string
      provider:
        example: openai
        type: string
    required:
    - base_url
    - model_name
    - provider
    type: object
  medicalagent_internal_model.AgentChatMessage:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      role:
        type: string
      session_id:
        type: integer
      turn_id:
        type: string
    type: object
  medicalagent_internal_model.AgentChatTurnResponse:
    properties:
      assistant_message:
