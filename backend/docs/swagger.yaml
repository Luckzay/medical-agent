host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 中医药知识库 API 服务 —— 方剂、单味药、对药、论文、分子信息、名家经验管理
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AI Medical Agent API
  version: "1.0"
paths:
  /api/admin/llm-config:
    get:
      description: 管理员查看当前的 LLM 提供商、基础 URL 和模型名称（API Key 会被脱敏）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/medicalagent_internal_model.LLMConfig'
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取 LLM 配置
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: 管理员更新 LLM 配置信息
      parameters:
      - description: 配置信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateLLMConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新 LLM 配置
      tags:
      - admin
  /api/agent/runs:
    post:
      consumes:
      - application/json
      description: 提交研究目标和相关药物，开始异步分析任务
      parameters:
      - description: 创建请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createAgentRunRequest'
      - description: 幂等性密钥
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            properties:
              data:
                $ref: '#/definitions/medicalagent_internal_model.AgentRunResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              error:
                type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Agent Run
      tags:
      - agent
  /api/agent/runs/{run_id}:
    get:
      consumes:
      - application/json
      description: 根据任务 ID 获取异步分析任务的状态和结果
      parameters:
      - description: 任务 ID
        in: path
        name: run_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/medicalagent_internal_model.AgentRunResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取 Agent Run 详情
      tags:
      - agent
  /api/agent/runs/{run_id}/resume:
    post:
      consumes:
      - application/json
      description: 重新启动状态为失败的任务
      parameters:
      - description: 任务 ID
        in: path
        name: run_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/medicalagent_internal_model.AgentRunResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 恢复失败的 Agent Run
      tags:
      - agent
  /api/agent/sessions:
    get:
      description: 获取当前用户的所有 Agent 对话会话
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/medicalagent_internal_model.AgentSession'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取对话会话列表
      tags:
      - agent-chat
    post:
      consumes:
      - application/json
      description: 为用户创建一个新的 Agent 对话会话
      parameters:
      - description: 会话信息
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_handler.createAgentSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/medicalagent_internal_model.AgentSession'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建对话会话
      tags:
      - agent-chat
  /api/agent/sessions/{id}:
    get:
      description: 获取指定会话的详情及所有历史消息
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                properties:
                  messages:
                    items:
                      $ref: '#/definitions/medicalagent_internal_model.AgentChatMessage'
                    type: array
                  session:
                    $ref: '#/definitions/medicalagent_internal_model.AgentSession'
                type: object
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取会话详情
      tags:
      - agent-chat
  /api/agent/sessions/{id}/messages:
    post:
      consumes:
      - application/json
      description: 在指定会话中发送消息，返回生成的 Turn ID
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 消息内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.sendAgentMessageRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            properties:
              data:
                properties:
                  status:
                    type: string
                  turn_id:
                    type: string
                type: object
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 发送对话消息
      tags:
      - agent-chat
  /api/agent/sessions/{id}/turns/{turn_id}:
    get:
      description: 获取指定对话轮次（Turn）的当前状态 and 分析结果
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 轮次 ID
        in: path
        name: turn_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/medicalagent_internal_model.AgentChatTurnResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
