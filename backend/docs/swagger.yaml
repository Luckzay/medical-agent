  /api/agent/sessions/{id}/turns/{turn_id}/stream:
    get:
      description: |-
        通过 SSE 流式获取轮次的执行进度、事件以及最终结果。
        事件帧格式为 Data: {sequence: int64, ...}。
        事件类型包括:
        1. "execution": 包含中间执行步骤的事件帧。
        2. "turn": 包含最终状态 (done/failed) 和完整结果的结束帧。
        当收到 status 为 "done" 或 "failed" 的 "turn" 事件，或连接断开时，流式传输结束。
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 轮次 ID
        in: path
        name: turn_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 流式获取轮次进度 (SSE)
      tags:
      - agent-chat
