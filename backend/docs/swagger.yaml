      created_at:
        type: string
      error_message:
        type: string
      events:
        items:
          type: integer
        type: array
      session_id:
        type: integer
      status:
        type: string
      turn_id:
        type: string
      updated_at:
        type: string
    type: object
  medicalagent_internal_model.AgentRunResponse:
