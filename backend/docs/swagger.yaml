  /internal/v1/llm/chat/stream:
    post:
      consumes:
      - application/json
      description: |-
        供 Agent 服务内部调用的 LLM 流式对话接口 (SSE)。
        事件帧格式为标准的 SSE 格式，包含 event 和 data 字段。
        常见事件类型:
        1. "message": 对话内容增量帧。
        2. "error": 发生错误时的通知帧。
        3. "done": 对话正常结束的标记。
      parameters:
      - description: 内部认证令牌
        in: header
        name: X-Agent-Token
        required: true
        type: string
      - description: 对话请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.chatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - AgentTokenAuth: []
      summary: 内部 LLM 流式对话接口
      tags:
      - internal
securityDefinitions:
  AgentTokenAuth:
    in: header
    name: X-Agent-Token
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
