[project]
name = "medical-agent-service"
version = "0.7.0"
description = "Deterministic scientific analysis Python agent service"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "mcp>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pymysql>=1.1,<2.0",
    "qdrant-client>=1.15,<1.17",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.3,<6.0",
    "torch>=2.2,<3.0",
]
rdkit = ["rdkit>=2024.3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
    "types-openpyxl>=3.1,<4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]
